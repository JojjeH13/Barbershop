services:

  db:
    image: mysql:8.0
    container_name: mysql-container
    restart: unless-stopped
    ports:
      
"3306:3306"
environment:
    MYSQL_ROOT_PASSWORD: password
    MYSQL_DATABASE: barbershopdb
    MYSQL_USER: appuser
    MYSQL_PASSWORD: apppassword
    volumes:
    - mysql_data:/var/lib/mysql

volumes:
  mysql_data: